name: vailib
services:
    # ── Database ───────────────────────────────────────────
    db:
        container_name: library-db
        image: postgres:13-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-sopds}
            POSTGRES_USER: ${POSTGRES_USER:-sopds}
            POSTGRES_PASSWORD: "${DB_PASSWORD:-changeme}"
        volumes:
            - ${DB_DATA_PATH:-./data/postgres}:/var/lib/postgresql/data
        networks:
            - library-net

    # ── SOPDS Web, Bot & Converter (Unified) ───────────────
    sopds:
        container_name: vailib
        build:
            context: .
            dockerfile: Dockerfile_vailib
        restart: unless-stopped
        depends_on:
            - db
        environment:
            DB_HOST: db
            DB_NAME: ${POSTGRES_DB:-sopds}
            DB_USER: ${POSTGRES_USER:-sopds}
            DB_PASS: "${DB_PASSWORD:-changeme}"
            DB_PASSWORD: "${DB_PASSWORD:-changeme}"
            DB_PORT: "5432"
            EXT_DB: "True"
            MIGRATE: "True"
            SOPDS_ROOT_LIB: /library
            SOPDS_TMBOT_ENABLE: "False"
            TIME_ZONE: ${TIME_ZONE:-Europe/Madrid}
            BOT_TOKEN: "${BOT_TOKEN:-YOUR_TELEGRAM_BOT_TOKEN}"
            CHAT_ID: "${CHAT_ID:-YOUR_TELEGRAM_CHAT_ID}"
        ports:
            - "8081:8001"
        volumes:
            - ${SOPDS_DATA_PATH:-/DATA/AppData/sopds/db}:/var/lib/sopds
            - ${BOOKS_PATH:-/DATA/Downloads/books}:/library

        networks:
            - library-net

networks:
    library-net:
        name: vailib_network

volumes:
    db-data:
        driver: local
