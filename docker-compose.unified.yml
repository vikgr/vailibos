name: vailib
services:
    # ── Database ───────────────────────────────────────────
    db:
        container_name: library-db
        image: postgres:13-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-sopds}
            POSTGRES_USER: ${POSTGRES_USER:-sopds}
            POSTGRES_PASSWORD: "${DB_PASSWORD:-changeme}"
        volumes:
            - ${DB_DATA_PATH:-./data/postgres}:/var/lib/postgresql/data
        networks:
            - library-net

    # ── SOPDS Web & OPDS ──────────────────────────────────
    sopds:
        container_name: vailib
        build:
            context: .
            dockerfile: Dockerfile_vailib
        restart: unless-stopped
        depends_on:
            - db
        environment:
            DB_HOST: db
            DB_NAME: ${POSTGRES_DB:-sopds}
            DB_USER: ${POSTGRES_USER:-sopds}
            DB_PASS: "${DB_PASSWORD:-changeme}"
            DB_PORT: "5432"
            SOPDS_ROOT_LIB: /library
            SOPDS_TMBOT_ENABLE: "False" # We use our own bot
            TIME_ZONE: ${TIME_ZONE:-Europe/Madrid}
        ports:
            - "8081:8001"
        volumes:
            - ${SOPDS_DATA_PATH:-./data/sopds}:/var/lib/sopds
            - ${BOOKS_PATH:-./data/books}:/library:ro

        networks:
            - library-net

    # ── Telegram Bot & PDF Converter ──────────────────────
    bot-converter:
        container_name: library-bot
        build:
            context: .
            dockerfile: Dockerfile_converter
        restart: unless-stopped
        depends_on:
            - db
        environment:
            BOT_TOKEN: "${BOT_TOKEN}"
            CHAT_ID: "${CHAT_ID}"
            DB_HOST: db
            DB_USER: ${POSTGRES_USER:-sopds}
            DB_NAME: ${POSTGRES_DB:-sopds}
            PGPASSWORD: "${DB_PASSWORD:-changeme}"
        volumes:
            - ${BOOKS_PATH:-./data/books}:/library # RW for conversion
        networks:
            - library-net

networks:
    library-net:
        name: library_network
