name: vailib
services:
    # ── Database ───────────────────────────────────────────
    db:
        container_name: vailib-db
        image: postgres:13-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-sopds}
            POSTGRES_USER: ${POSTGRES_USER:-sopds}
            POSTGRES_PASSWORD: "${DB_PASSWORD:-151104}"
        volumes:
            - ${DB_DATA_PATH:-/DATA/AppData/sopds/postgres}:/var/lib/postgresql/data
        networks:
            - library-net

    # ── SOPDS Web & OPDS ──────────────────────────────────
    sopds:
        container_name: vailib
        build:
            context: .
            dockerfile: Dockerfile_vailib
        restart: unless-stopped
        depends_on:
            - db
        environment:
            DB_HOST: db
            DB_NAME: ${POSTGRES_DB:-sopds}
            DB_USER: ${POSTGRES_USER:-sopds}
            DB_PASS: "${DB_PASSWORD:-151104}"
            DB_PORT: "5432"
            SOPDS_ROOT_LIB: /library
            SOPDS_TMBOT_ENABLE: "False"
            TIME_ZONE: ${TIME_ZONE:-Europe/Madrid}
        ports:
            - "8081:8001"
        volumes:
            - ${SOPDS_DATA_PATH:-/DATA/AppData/sopds/db}:/var/lib/sopds
            - ${BOOKS_PATH:-/DATA/Downloads/books}:/library:ro

        networks:
            - library-net

    # ── Telegram Bot & PDF Converter ──────────────────────
    bot-converter:
        container_name: vailib-bot
        build:
            context: .
            dockerfile: Dockerfile_converter
        restart: unless-stopped
        depends_on:
            - db
        environment:
            BOT_TOKEN: "${BOT_TOKEN:-7602944873:AAHJMk3UZvNSQCvID4EvmJsP68e4TYGLOZ8}"
            CHAT_ID: "${CHAT_ID:-1655536}"
            DB_HOST: db
            DB_USER: ${POSTGRES_USER:-sopds}
            DB_NAME: ${POSTGRES_DB:-sopds}
            PGPASSWORD: "${DB_PASSWORD:-151104}"
        volumes:
            - ${BOOKS_PATH:-/DATA/Downloads/books}:/library # RW for conversion
        networks:
            - library-net

networks:
    library-net:
        name: vailib_network

volumes:
    db-data:
        driver: local
