{% extends "sopds_main.html" %}
{% load i18n %}

{% block ext-body %}
<div class="auth-container">
  <div class="modern-auth-card">
    <h3 class="auth-title" data-trans="user_login">{% trans "User Login" %}</h3>
    
    {% if system_message %}
    <div class="callout alert" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; text-align: center;">
      <i class="fi-alert" style="margin-right: 8px;"></i> {{ system_message.text }}
    </div>
    {% endif %}

    <form method="post" action="">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next_url|default:'' }}">
      <div class="form-group">
        <label data-trans="username">{% trans "Username" %}</label>
        <input type="text" class="modern-input" name="username" placeholder="{% trans "Enter Username" %}" data-trans="enter_user" required autofocus>
      </div>
      <div class="form-group">
        <label data-trans="password">{% trans "Password" %}</label>
        <input type="password" class="modern-input" name="password" placeholder="{% trans "Enter Password" %}" data-trans="enter_pass" required>
      </div>
      <div class="form-actions" style="margin-top: 25px;">
        <button type="submit" class="modern-btn auth-submit-btn" data-trans="login_btn">{% trans "Log in" %}</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
