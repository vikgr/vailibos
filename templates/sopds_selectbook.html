{% extends "sopds_main.html" %}
{% load staticfiles %}
{% load i18n %}

{% block body %}
{% autoescape on %}
<div class="index-grid">
	{% for chars in items %}
	{% if chars.cnt >= splititems %}
	<a href="{% url 'web:book' %}?lang={{lang_code}}&chars={{chars.id|urlencode|iriencode}}" class="index-card">
		{% else %}
		<a href="{% url 'web:searchbooks' %}?searchtype=b&searchterms={{chars.id|urlencode|iriencode}}"
			class="index-card">
			{% endif %}
			<div class="index-letter">{{ chars.id }}</div>
			<div class="index-count">
				<span data-trans="t_tot">Total:</span> {{ chars.cnt }} <span data-trans="t_bk">books.</span>
			</div>
		</a>
		{% endfor %}
</div>
{% endautoescape %}

{% endblock %}
